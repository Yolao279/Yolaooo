<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yolao — Vidéos et Shorts</title>
  <meta name="description" content="Le site officiel de Yolao : dernières vidéos et derniers Shorts YouTube.">
  <meta name="theme-color" content="#07070b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Yolao — Vidéos et Shorts">
  <meta property="og:description" content="Le site officiel de Yolao : dernières vidéos et derniers Shorts YouTube.">
  <meta name="twitter:card" content="summary_large_image">
  <style>
:root {
  --bg: #07070b;
  --panel: #101018;
  --line: rgba(255, 255, 255, .08);
  --text: #f1f0f7;
  --muted: #9a98ab;
  --violet: #8b5cf6;
  --violet-2: #6d3ff0;
  --cyan: #22d3ee;
  --red: #ff4d6d;
  --radius: 20px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; overflow-x: hidden;
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
[hidden] { display: none !important; }

/* Ambiance */
.glow { position: fixed; z-index: -2; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(110px); opacity: .28; pointer-events: none; }
.glow-a { top: -25vmax; left: -15vmax; background: var(--violet); animation: drift 18s ease-in-out infinite alternate; }
.glow-b { bottom: -30vmax; right: -20vmax; background: var(--cyan); opacity: .16; animation: drift 24s ease-in-out infinite alternate-reverse; }
.grain {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }

/* En-tête */
.hero { text-align: center; padding: clamp(48px, 9vw, 96px) 20px 28px; }
.avatar-link { position: relative; display: inline-block; width: clamp(130px, 22vw, 190px); aspect-ratio: 1; border-radius: 50%; animation: float 6s ease-in-out infinite; }
.avatar, .avatar-fallback { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #14141d; transition: transform .35s ease; }
.avatar-fallback { display: grid; place-items: center; font-size: 4.5rem; font-weight: 800; background: linear-gradient(135deg, var(--violet), var(--cyan)); }
.avatar-ring { position: absolute; inset: -8px; border-radius: 50%; background: conic-gradient(var(--violet), var(--cyan), var(--red), var(--violet)); filter: blur(14px); opacity: .6; transition: opacity .35s; }
.avatar-link:hover .avatar-ring { opacity: .95; }
.avatar-link:hover .avatar { transform: scale(1.04); }
@keyframes float { 50% { transform: translateY(-7px); } }
.hero h1 { margin: 22px 0 6px; font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -.02em; }
.hero h1 a { background: linear-gradient(90deg, #fff, #c9b8ff 60%, #8ae9fb); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { max-width: 520px; margin: 0 auto 22px; color: var(--muted); font-size: 1.05rem; }
.socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
.social { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); transition: transform .25s, border-color .25s, box-shadow .25s; }
.social svg { width: 22px; height: 22px; fill: currentColor; }
.social:hover { transform: translateY(-3px); border-color: var(--violet); box-shadow: 0 0 22px color-mix(in srgb, var(--violet) 45%, transparent); }

/* Sections */
main { width: min(1180px, 100% - 40px); margin: 0 auto; }
.block { padding: 44px 0 8px; }
.block h2 { margin: 0 0 24px; font-size: clamp(1.5rem, 3.6vw, 2.1rem); letter-spacing: -.01em; }
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
.reveal.in { opacity: 1; transform: none; }
.empty { padding: 44px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: rgba(255, 255, 255, .02); }

/* Cartes */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--card-min, 340px)), 1fr)); gap: 24px; }
.short-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--short-min, 190px)), 1fr)); gap: 18px; }
.card { display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); transition: transform .3s ease, box-shadow .3s ease, border-color .3s; }
.card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--violet) 50%, transparent); box-shadow: 0 14px 40px rgba(0, 0, 0, .5), 0 0 28px color-mix(in srgb, var(--violet) 22%, transparent); }
.thumb { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: #0b0b12; }
.card.short .thumb { aspect-ratio: 9 / 16; }
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card:hover .thumb img { transform: scale(1.04); }
.preview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
.preview.on { opacity: 1; }
.card-body { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px 18px; flex: 1; }
.card h3 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
.card.short h3 { font-size: .92rem; }
.card p { margin: 0; color: var(--muted); font-size: .92rem; }
.card time { color: var(--muted); font-size: .82rem; }
.watch { margin-top: auto; padding-top: 8px; color: var(--cyan); font-weight: 600; font-size: .9rem; }

/* Recherche, mise en avant */
.block-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.block-head h2 { margin: 0; }
.search { width: min(100%, 280px); }
.badge { position: absolute; top: 12px; left: 12px; z-index: 2; padding: 4px 11px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: linear-gradient(135deg, var(--violet), var(--violet-2)); box-shadow: 0 4px 14px rgba(0,0,0,.45); }
@media (min-width: 900px) {
  .video-grid.has-featured .card.featured { grid-column: span 2; }
  .video-grid.has-featured .card.featured h3 { font-size: 1.35rem; }
}

/* Teasers / compte à rebours */
.teasers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px; }
.teaser { overflow: hidden; border-radius: var(--radius); background: var(--panel); border: 1px solid color-mix(in srgb, var(--violet) 50%, transparent); box-shadow: 0 0 44px color-mix(in srgb, var(--violet) 20%, transparent); }
.teaser-media { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #1b1233, #0b2a33); }
.teaser-media img { width: 100%; height: 100%; object-fit: cover; }
.teaser-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--panel), transparent 60%); }
.teaser-body { position: relative; z-index: 1; padding: 0 22px 24px; margin-top: -14px; }
.teaser h3 { margin: 0 0 6px; font-size: 1.4rem; }
.teaser p { margin: 0 0 16px; color: var(--muted); }
.countdown { display: flex; gap: 10px; }
.cd-box { flex: 1; max-width: 88px; padding: 10px 4px; text-align: center; border-radius: 14px; background: #0a0a10; border: 1px solid var(--line); }
.cd-box b { display: block; font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cd-box small { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }
.live, .teaser .go { display: none; }
.live { font-size: 1.15rem; font-weight: 700; color: var(--cyan); }
.teaser.done .countdown { display: none; }
.teaser.done .live { display: block; }
.teaser.done .go { display: inline-block; margin-top: 14px; }
.t-prev { max-height: 170px; margin: 10px 0; border-radius: 12px; object-fit: cover; }
.settings { margin-top: 6px; }

/* Lueur qui suit le curseur */
.cursor-glow { position: fixed; left: 0; top: 0; z-index: -1; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(circle, color-mix(in srgb, var(--violet) 24%, transparent), transparent 65%); }

/* Pied de page */
.footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; width: min(1180px, 100% - 40px); margin: 70px auto 0; padding: 26px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
.footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
.footer a:hover { color: var(--text); }

/* Boutons */
.btn { font: inherit; font-weight: 600; cursor: pointer; padding: 10px 18px; border-radius: 12px; color: var(--text); background: #1a1a26; border: 1px solid var(--line); transition: transform .2s, box-shadow .2s, background .2s; }
.btn:hover { transform: translateY(-1px); background: #232334; }
.btn.primary { background: linear-gradient(135deg, var(--violet), var(--violet-2)); border-color: transparent; box-shadow: 0 6px 20px color-mix(in srgb, var(--violet) 35%, transparent); }
.btn.danger { color: #ffd3da; border-color: rgba(255, 77, 109, .45); }
.btn.danger:hover { background: rgba(255, 77, 109, .18); }
.btn.small { padding: 7px 12px; font-size: .85rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

/* Administration */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(4, 4, 8, .78); backdrop-filter: blur(6px); animation: fade .25s ease; overflow-y: auto; }
.modal { width: min(440px, 100%); padding: 26px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 60px color-mix(in srgb, var(--violet) 25%, transparent); animation: pop .3s cubic-bezier(.2, .9, .3, 1.2); }
.modal.wide { width: min(860px, 100%); max-height: 92vh; overflow-y: auto; }
.modal h3 { margin: 0 0 16px; font-size: 1.3rem; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } }
label { display: block; margin: 12px 0 5px; font-size: .88rem; color: var(--muted); }
input, textarea, select { width: 100%; font: inherit; color: var(--text); padding: 11px 13px; border-radius: 12px; background: #0a0a10; border: 1px solid var(--line); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 25%, transparent); }
textarea { resize: vertical; min-height: 70px; }
.row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }
.row.flush { margin: 0; }
.msg { min-height: 1.3em; margin-top: 12px; font-size: .9rem; color: var(--red); }
.dash-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab[aria-selected="true"] { background: var(--violet); border-color: transparent; }
.list { display: grid; gap: 10px; margin-top: 14px; }
.item { display: grid; grid-template-columns: 84px 1fr auto; gap: 14px; align-items: center; padding: 10px; border-radius: 14px; background: #0c0c13; border: 1px solid var(--line); }
.item img { width: 84px; height: 52px; object-fit: cover; border-radius: 8px; }
.item.is-short img { height: 84px; }
.item b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { color: var(--muted); }
.item-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; transform: translateX(-50%); padding: 11px 18px; border-radius: 12px; background: #1d1d2b; border: 1px solid var(--violet); animation: pop .3s ease; }

@media (max-width: 640px) {
  .item { grid-template-columns: 64px 1fr; }
  .item img { width: 64px; height: 44px; }
  .item-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .btn { padding: 12px 16px; }
  .footer { justify-content: center; text-align: center; }
}

/* Studio admin */
.modal.studio-modal { width: min(1060px, 100%); padding: 0; overflow: hidden; border: 1px solid transparent;
  background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(135deg, var(--violet), var(--cyan), var(--red)) border-box;
  box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 70px color-mix(in srgb, var(--violet) 28%, transparent); }
.studio { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: min(88vh, 780px); }
.side { display: flex; flex-direction: column; gap: 18px; padding: 22px 16px; overflow-y: auto; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--violet) 16%, #0b0b12), #0b0b12 70%); }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
.brand img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--violet); box-shadow: 0 0 20px color-mix(in srgb, var(--violet) 55%, transparent); }
.brand b { display: block; line-height: 1.2; }
.brand small { color: var(--muted); }
.nav { display: grid; gap: 6px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; text-align: left; cursor: pointer; transition: background .2s, color .2s, transform .2s; }
.nav button:hover { background: rgba(255,255,255,.06); color: var(--text); transform: translateX(3px); }
.nav button.on { color: #fff; background: linear-gradient(135deg, color-mix(in srgb, var(--violet) 55%, transparent), color-mix(in srgb, var(--violet) 18%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--violet) 70%, transparent), 0 8px 26px color-mix(in srgb, var(--violet) 28%, transparent); }
.nav svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
.nav span { flex: 1; }
.nav em { font-style: normal; font-size: .78rem; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.1); }
.side-foot { margin-top: auto; display: grid; gap: 8px; }
.main { padding: 26px 28px 30px; overflow-y: auto; }
.main .dash-head h3 { margin: 0; font-size: 1.5rem; }
.publish { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 6px 0 18px; padding: 16px 18px; border-radius: 20px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--violet) 24%, #0c0c13), color-mix(in srgb, var(--cyan) 12%, #0c0c13));
  border: 1px solid color-mix(in srgb, var(--violet) 45%, transparent); }
.publish-txt b { display: block; font-size: 1.05rem; }
.publish-txt span { color: var(--muted); font-size: .88rem; }
.publish-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-glow { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 700; color: #fff; cursor: pointer;
  background: linear-gradient(135deg, var(--violet), var(--violet-2)); box-shadow: 0 10px 28px color-mix(in srgb, var(--violet) 50%, transparent); transition: transform .25s, box-shadow .25s; }
.btn-glow::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.38) 50%, transparent 70%); transform: translateX(-130%); transition: transform .7s; }
.btn-glow:hover { transform: translateY(-2px); box-shadow: 0 14px 36px color-mix(in srgb, var(--violet) 65%, transparent); }
.btn-glow:hover::before { transform: translateX(130%); }
.btn-glow svg { width: 20px; height: 20px; fill: currentColor; position: relative; }
.btn-glow span { position: relative; }
.btn-glow.alt { background: #11111b; color: var(--cyan); box-shadow: inset 0 0 0 1.5px var(--cyan), 0 0 24px color-mix(in srgb, var(--cyan) 28%, transparent); }
.btn-glow.alt:hover { box-shadow: inset 0 0 0 1.5px var(--cyan), 0 0 36px color-mix(in srgb, var(--cyan) 50%, transparent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
.stat { padding: 14px 16px; border-radius: 16px; background: #0c0c13; border: 1px solid var(--line); }
.stat b { display: block; font-size: 1.9rem; line-height: 1.1; background: linear-gradient(90deg, #fff, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { color: var(--muted); font-size: .82rem; }
.main .item { transition: border-color .2s, transform .2s; }
.main .item:hover { border-color: color-mix(in srgb, var(--violet) 55%, transparent); transform: translateX(2px); }
.settings { max-width: 640px; }
@media (max-width: 760px) {
  .studio { grid-template-columns: 1fr; height: 92vh; overflow-y: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .nav { grid-auto-flow: column; grid-auto-columns: 1fr; overflow-x: auto; }
  .nav button { flex-direction: column; gap: 4px; padding: 10px 6px; font-size: .8rem; text-align: center; }
  .nav em, .brand small { display: none; }
  .side-foot { grid-auto-flow: column; margin-top: 0; }
  .main { overflow: visible; padding: 20px 16px 28px; }
  .publish-btns .btn-glow { flex: 1; justify-content: center; }
}


/* Écran de verrouillage */
body.locked .hero, body.locked main, body.locked .footer { display: none; }
.lockscreen { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; overflow-y: auto; text-align: center; background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--violet) 22%, #07070b), #07070b 70%); }
.lock-card { width: min(560px, 100%); display: grid; justify-items: center; gap: 14px; }
.lock-icon { position: relative; width: 104px; height: 104px; display: grid; place-items: center; border-radius: 50%; background: #11111b; border: 2px solid var(--violet); box-shadow: 0 0 50px color-mix(in srgb, var(--violet) 55%, transparent); animation: lockpulse 2.4s ease-in-out infinite; }
.lock-icon svg { width: 48px; height: 48px; fill: var(--text); }
@keyframes lockpulse { 50% { box-shadow: 0 0 90px color-mix(in srgb, var(--violet) 80%, transparent); transform: scale(1.05); } }
.lock-chip { padding: 5px 16px; border-radius: 999px; font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; background: color-mix(in srgb, var(--red) 22%, transparent); color: #ffd3da; border: 1px solid color-mix(in srgb, var(--red) 55%, transparent); }
.lock-card h1 { margin: 4px 0 0; font-size: clamp(2rem, 7vw, 3.2rem); letter-spacing: -.02em; background: linear-gradient(90deg, #fff, #c9b8ff 60%, #8ae9fb); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lock-why { max-width: 520px; width: 100%; margin: 6px 0 0; padding: 14px 24px 18px; border-radius: 20px; background: linear-gradient(180deg, rgba(255, 77, 109, .14), rgba(255, 77, 109, .05)); border: 1px solid rgba(255, 77, 109, .5); box-shadow: 0 0 40px rgba(255, 77, 109, .22), inset 0 0 30px rgba(255, 77, 109, .08); animation: whyglow 3s ease-in-out infinite; }
@keyframes whyglow { 50% { box-shadow: 0 0 64px rgba(255, 77, 109, .4), inset 0 0 30px rgba(255, 77, 109, .12); } }
.lock-card .lock-why small { display: block; margin-bottom: 4px; font-size: .72rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: rgba(255, 150, 170, .85); }
.lock-reason { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 800; line-height: 1.25; letter-spacing: .01em; color: #ff4d6d; text-shadow: 0 0 22px rgba(255, 77, 109, .65), 0 0 2px rgba(255, 77, 109, .9); white-space: pre-line; overflow-wrap: anywhere; }
.lock-timer { margin-top: 8px; font-size: clamp(2.6rem, 12vw, 4.6rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .04em; text-shadow: 0 0 40px color-mix(in srgb, var(--violet) 70%, transparent); }
.lock-bar { width: min(380px, 100%); height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.lock-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width 1s linear; }
.lock-card small { color: var(--muted); }

/* Onglet verrouillage (admin) */
.lock-warn { padding: 12px 14px; border-radius: 14px; font-size: .9rem; color: #ffe2b8; background: rgba(255, 170, 60, .1); border: 1px solid rgba(255, 170, 60, .35); }
.lockpanel label { margin-top: 18px; }
.lock-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lock-type { display: grid; justify-items: center; gap: 4px; padding: 16px 8px; text-align: center; font: inherit; color: var(--muted); cursor: pointer; border-radius: 16px; background: #0c0c13; border: 1px solid var(--line); transition: transform .2s, border-color .2s, box-shadow .2s, color .2s; }
.lock-type svg { width: 28px; height: 28px; fill: currentColor; }
.lock-type b { color: var(--text); }
.lock-type small { font-size: .76rem; }
.lock-type:hover { transform: translateY(-2px); }
.lock-type.on { color: var(--red); border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, #0c0c13); box-shadow: 0 0 28px color-mix(in srgb, var(--red) 30%, transparent); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.chip { font: inherit; font-size: .85rem; padding: 7px 14px; cursor: pointer; color: var(--text); border-radius: 999px; background: #151520; border: 1px solid var(--line); transition: background .2s, border-color .2s; }
.chip:hover { border-color: var(--violet); }
.chip.on { background: var(--violet); border-color: transparent; }
.lock-custom { width: 84px; padding: 7px 10px; border-radius: 999px; }
.lock-summary { margin-top: 14px; color: var(--cyan); font-weight: 600; }
.btn-glow.danger { background: linear-gradient(135deg, #ff4d6d, #e11d48); box-shadow: 0 10px 28px rgba(255, 77, 109, .45); }
.btn-glow.danger:hover { box-shadow: 0 14px 38px rgba(255, 77, 109, .65); }
.lock-live { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 22px; border-radius: 22px; background: linear-gradient(120deg, rgba(255, 77, 109, .18), #0c0c13); border: 1px solid rgba(255, 77, 109, .55); box-shadow: 0 0 50px rgba(255, 77, 109, .2); }
.lock-pulse { width: 70px; height: 70px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 77, 109, .16); border: 2px solid var(--red); animation: lockpulse 2s ease-in-out infinite; }
.lock-pulse svg { width: 32px; height: 32px; fill: var(--red); }
.lock-live-txt { flex: 1; min-width: 200px; display: grid; gap: 2px; }
.lock-live-txt small { color: var(--muted); }
.lock-live-txt b { font-size: 1.35rem; color: #ff4d6d; text-shadow: 0 0 18px rgba(255, 77, 109, .55); overflow-wrap: anywhere; }
.lock-live-txt small:first-child { color: var(--red); font-weight: 800; letter-spacing: .08em; }
.lock-time { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .lock-types { grid-template-columns: 1fr; } }


/* Menu du site */
html { scroll-padding-top: 84px; }
.announce { padding: 10px 16px; text-align: center; font-weight: 700; font-size: .95rem; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 18px; padding: 10px clamp(14px, 3vw, 32px); background: rgba(7,7,11,.72); backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--line); }
.tb-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; }
.tb-brand img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--violet); box-shadow: 0 0 16px color-mix(in srgb, var(--violet) 55%, transparent); }
.tb-links { display: flex; gap: 4px; margin: 0 auto; }
.tb-links a { padding: 8px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: .95rem; transition: color .2s, background .2s; }
.tb-links a:hover { color: var(--text); background: rgba(255,255,255,.06); }
.tb-links a.on { color: #fff; background: color-mix(in srgb, var(--violet) 28%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--violet) 55%, transparent); }
.tb-cta { padding: 9px 18px; font-size: .9rem; }
.tb-burger { display: none; width: 42px; height: 42px; padding: 0; place-content: center; gap: 5px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.tb-burger span { display: block; width: 20px; height: 2px; border-radius: 2px; background: var(--text); transition: transform .25s, opacity .25s; }
.topbar.open .tb-burger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.topbar.open .tb-burger span:nth-child(2) { opacity: 0; }
.topbar.open .tb-burger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
@media (max-width: 820px) {
  .tb-burger { display: grid; margin-left: auto; }
  .tb-cta { display: none; }
  .tb-links { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; gap: 4px; margin: 0; padding: 12px; background: rgba(9,9,14,.97); border-bottom: 1px solid var(--line); }
  .topbar.open .tb-links { display: flex; }
  .tb-links a { padding: 13px 16px; }
}
body.locked .topbar, body.locked .announce { display: none; }
.hero-stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.hstat { padding: 8px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.hstat b { margin-right: 6px; font-size: 1.1rem; background: linear-gradient(90deg, #fff, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hstat span { color: var(--muted); font-size: .9rem; }
.hero-cta { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.tagbar { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 22px; }
.chip { text-transform: capitalize; }

/* Panel : nouveautés */
.cmd { margin: 0 0 14px; font-family: ui-monospace, Consolas, monospace; color: var(--cyan); background: #06060b; }
.owner { display: inline-block; margin-left: 8px; padding: 1px 8px; font-size: .62rem; font-weight: 800; letter-spacing: .12em; border-radius: 99px; color: #1a1200; background: linear-gradient(135deg, #fde68a, #f59e0b); }
.sub { margin: 22px 0 10px; font-size: .95rem; color: var(--muted); }
.logrow { grid-template-columns: 1fr auto; }
.check { display: flex; align-items: center; gap: 10px; color: var(--text); cursor: pointer; }
input[type="checkbox"] { width: auto; accent-color: var(--violet); }
.toast { max-width: min(92vw, 720px); text-align: center; }
.boot { position: absolute; inset: 0; z-index: 5; display: grid; align-content: center; justify-content: center; gap: 6px; background: #05050a; animation: bootout .4s ease 1.05s forwards; }
.boot p { margin: 0; font: 700 1.05rem/1.8 ui-monospace, Consolas, monospace; color: var(--cyan); text-shadow: 0 0 14px var(--cyan); opacity: 0; animation: bootin .25s ease forwards; }
.boot p:nth-child(2) { animation-delay: .3s; }
.boot p:nth-child(3) { animation-delay: .6s; color: #34d399; text-shadow: 0 0 14px #34d399; }
@keyframes bootin { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
@keyframes bootout { to { opacity: 0; visibility: hidden; } }
.confetti { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
body.party .hero, body.party main { animation: party 1s linear infinite; }
@keyframes party { to { filter: hue-rotate(360deg); } }


/* Réglages */
:root[data-bg="amoled"] { --bg: #000; --panel: #09090d; }
:root[data-density="compact"] { --card-min: 260px; --short-min: 150px; }
:root[data-density="large"] { --card-min: 440px; --short-min: 240px; }
.more-wrap { display: flex; justify-content: center; margin-top: 26px; }
body.no-dates .card time { display: none; }
body.no-ambient .glow, body.no-ambient .grain { display: none; }
body.no-cursor .cursor-glow { display: none; }
body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
body.calm .reveal { opacity: 1; transform: none; }
.settings { max-width: 780px; }
.set-group { margin: 0 0 18px; padding: 18px 20px 14px; border-radius: 18px; background: #0c0c13; border: 1px solid var(--line); }
.set-title { margin: 0; font-size: 1.05rem; background: linear-gradient(90deg, #fff, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.set-desc { margin: 2px 0 6px; color: var(--muted); font-size: .86rem; }
.switch { position: relative; display: flex; align-items: center; gap: 14px; margin: 8px 0 0; padding: 10px 12px; border-radius: 14px; background: #10101a; border: 1px solid var(--line); cursor: pointer; color: var(--text); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { position: relative; flex: none; width: 44px; height: 26px; border-radius: 99px; background: #2a2a3a; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + .sw { background: var(--violet); box-shadow: 0 0 14px color-mix(in srgb, var(--violet) 55%, transparent); }
.switch input:checked + .sw::after { transform: translateX(18px); }
.switch input:focus-visible + .sw { outline: 2px solid var(--cyan); outline-offset: 2px; }
.swt b { display: block; font-size: .95rem; font-weight: 600; }
.swt small { color: var(--muted); font-size: .8rem; }
input[type="range"] { padding: 0; accent-color: var(--violet); }
.row.wrap { justify-content: flex-start; }
.savebar { position: sticky; bottom: -30px; display: flex; justify-content: flex-end; padding: 16px 0 12px; background: linear-gradient(transparent, var(--panel) 40%); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}

/* =====================================================================
   Événements : comptes à rebours placés où tu veux sur le site
   ===================================================================== */
.evslot { display: grid; gap: 18px; }
.evslot:empty { display: none; }
.evslot.inmain { width: min(1180px, 100% - 40px); margin: 40px auto 0; }
main > .evslot { margin-top: 40px; }
#slot-hero { width: min(980px, 100% - 40px); margin: 32px auto 0; text-align: left; }
.teasers .ev { grid-column: 1 / -1; }
body.locked .evslot, body.locked .evfloat { display: none; }
.ev { --ev: #9d4dff; }
.ev-live { display: none; }
.ev-cta, .ev-link { display: none; }
.ev.done .ev-cta, .ev.cta-now .ev-cta, .ev.done .ev-link, .ev.cta-now .ev-link { display: inline-flex; }

/* --- Grand format : "event" --- */
.ev-full { position: relative; isolation: isolate; padding: 2px; color: #fff;
  background: linear-gradient(135deg, var(--ev), color-mix(in srgb, var(--ev) 12%, #000) 38%, color-mix(in srgb, var(--ev) 12%, #000) 62%, var(--ev));
  clip-path: polygon(0 0, calc(100% - 38px) 0, 100% 38px, 100% 100%, 38px 100%, 0 calc(100% - 38px)); }
.ev-face { position: relative; overflow: hidden; padding: clamp(24px, 4.4vw, 52px) clamp(20px, 4.6vw, 56px) clamp(30px, 4.4vw, 54px);
  background:
    radial-gradient(90% 130% at 100% 0%, color-mix(in srgb, var(--ev) 38%, transparent), transparent 62%),
    linear-gradient(180deg, #0d0a18, #07050f);
  clip-path: polygon(0 0, calc(100% - 37px) 0, 100% 37px, 100% 100%, 37px 100%, 0 calc(100% - 37px)); }
.ev-face::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(-58deg, transparent 0 26px, rgba(255, 255, 255, .028) 26px 28px); }
.ev-face::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; z-index: -1; pointer-events: none;
  background: linear-gradient(105deg, transparent, color-mix(in srgb, var(--ev) 22%, transparent), transparent);
  transform: translateX(-120%) skewX(-18deg); animation: evsheen 7s ease-in-out infinite; }
@keyframes evsheen { 0%, 55% { transform: translateX(-120%) skewX(-18deg); } 100% { transform: translateX(380%) skewX(-18deg); } }
.ev-media { position: absolute; top: 0; right: 0; bottom: 0; width: 58%; z-index: -1; opacity: .85; }
.ev-media img { width: 100%; height: 100%; object-fit: cover;
  -webkit-mask-image: linear-gradient(to left, #000 25%, transparent);
  mask-image: linear-gradient(to left, #000 25%, transparent); }
.ev-body { position: relative; }
.ev-badge { display: inline-block; padding: 6px 16px; background: var(--ev); color: #0a0612; font-weight: 900; font-size: .86rem; letter-spacing: .06em; text-transform: uppercase; transform: skewX(-12deg); }
.ev-badge span { display: block; transform: skewX(12deg); }
.ev-title { margin: 16px 0 8px; font-size: clamp(2.1rem, 7vw, 4.8rem); font-weight: 900; font-style: italic; line-height: .95; text-transform: uppercase; letter-spacing: -.01em; overflow-wrap: anywhere;
  text-shadow: 0 0 46px color-mix(in srgb, var(--ev) 80%, transparent), 3px 3px 0 color-mix(in srgb, var(--ev) 55%, #000); }
.ev-sub { max-width: 56ch; margin: 0; font-size: clamp(1rem, 2vw, 1.15rem); color: rgba(255, 255, 255, .78); }
.ev-count { display: flex; align-items: stretch; gap: clamp(4px, 1.2vw, 10px); margin: 26px 0 8px; max-width: 640px; }
.ev-unit { flex: 1 1 0; min-width: 0; padding: clamp(8px, 1.6vw, 14px) 4px clamp(8px, 1.4vw, 12px); text-align: center; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); border-bottom: 3px solid var(--ev); transform: skewX(-8deg); backdrop-filter: blur(4px); }
.ev-unit > * { display: block; transform: skewX(8deg); }
.ev-unit b { font-size: clamp(1.9rem, 7.4vw, 4.3rem); font-weight: 900; font-style: italic; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 26px var(--ev); }
.ev-unit small { margin-top: 5px; font-size: clamp(.58rem, 1.6vw, .74rem); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .62); }
.ev-unit b.tick { animation: evpop .4s ease; }
@keyframes evpop { 30% { transform: scale(1.12); color: var(--ev); } }
.ev-sep { align-self: center; font-size: clamp(1.2rem, 4vw, 2.4rem); font-weight: 900; color: var(--ev); opacity: .8; }
.ev-full .ev-live { margin: 22px 0 4px; font-size: clamp(1.8rem, 6vw, 3.4rem); font-weight: 900; font-style: italic; text-transform: uppercase; text-shadow: 0 0 34px var(--ev), 3px 3px 0 color-mix(in srgb, var(--ev) 55%, #000); overflow-wrap: anywhere; }
.ev-full.done .ev-count { display: none; }
.ev-full.done .ev-live { display: block; }
.ev-foot { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 18px; }
.ev-date { color: rgba(255, 255, 255, .68); font-size: .95rem; }
.ev-cta, .ev-link { align-items: center; padding: 12px 28px; background: #fff; color: #0a0612; font-weight: 900; font-style: italic; text-transform: uppercase; transform: skewX(-10deg); transition: background .2s, color .2s, box-shadow .2s; }
.ev-cta span, .ev-link span { display: block; transform: skewX(10deg); }
.ev-cta:hover, .ev-link:hover { background: var(--ev); color: #fff; box-shadow: 0 0 30px var(--ev); }
.ev-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, .08); }
.ev-bar i { display: block; height: 100%; width: calc(var(--p, 0) * 1%); background: linear-gradient(90deg, var(--ev), #fff); box-shadow: 0 0 16px var(--ev); }
.ev.hot .ev-unit { border-bottom-color: #ff4d6d; }
.ev.hot .ev-unit b { color: #ffe3e8; }

/* --- Bandeau (haut du site) et carte à plat --- */
.ev-compact { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; color: #fff; }
.ev-compact.at-top { justify-content: center; padding: 10px 16px; background: linear-gradient(90deg, color-mix(in srgb, var(--ev) 88%, #000), color-mix(in srgb, var(--ev) 42%, #000)); }
.ev-compact.at-flow { padding: 14px 20px; border-radius: 6px; background: #0b0912; border: 1px solid color-mix(in srgb, var(--ev) 55%, transparent); border-left: 5px solid var(--ev); box-shadow: 0 0 34px color-mix(in srgb, var(--ev) 18%, transparent); }
.ev-tag { padding: 2px 12px; background: var(--ev); color: #0a0612; font-weight: 900; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; transform: skewX(-12deg); }
.at-top .ev-tag { background: #fff; }
.ev-ctitle { font-weight: 800; font-style: italic; overflow-wrap: anywhere; }
.ev-mini { display: inline-flex; align-items: baseline; gap: 3px; font-variant-numeric: tabular-nums; }
.ev-mini b { margin-left: 8px; font-size: 1.2em; font-weight: 900; }
.ev-mini b:first-child { margin-left: 0; }
.ev-mini small { opacity: .75; font-size: .82em; }
.ev-compact .ev-live { font-weight: 900; font-style: italic; }
.ev-compact.done .ev-mini { display: none; }
.ev-compact.done .ev-live { display: inline; }
.ev-link { padding: 5px 16px; font-size: .88rem; }

/* --- Carte flottante --- */
.evfloat { position: fixed; right: 18px; bottom: 18px; z-index: 35; display: grid; gap: 10px; width: min(330px, calc(100vw - 36px)); }
.evfloat:empty { display: none; }
.ev-float { position: relative; padding: 16px 16px 16px; color: #fff; border-radius: 10px; background: linear-gradient(160deg, color-mix(in srgb, var(--ev) 22%, #0d0a18), #08060f 70%); border: 1px solid color-mix(in srgb, var(--ev) 60%, transparent); box-shadow: 0 20px 54px rgba(0, 0, 0, .6), 0 0 44px color-mix(in srgb, var(--ev) 28%, transparent); }
.ev-float .ev-tag { display: inline-block; margin-bottom: 8px; }
.ev-float .ev-ctitle { display: block; padding-right: 26px; font-size: 1.15rem; }
.ev-float .ev-count { margin: 12px 0 4px; gap: 5px; }
.ev-float .ev-unit { padding: 6px 2px; }
.ev-float .ev-unit b { font-size: 1.55rem; }
.ev-float .ev-unit small { font-size: .56rem; margin-top: 2px; }
.ev-float .ev-sep { display: none; }
.ev-float .ev-live { margin: 12px 0 2px; font-size: 1.3rem; font-weight: 900; font-style: italic; text-transform: uppercase; }
.ev-float.done .ev-count { display: none; }
.ev-float.done .ev-live { display: block; }
.ev-float .ev-cta { margin-top: 12px; padding: 9px 22px; }
.ev-x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; font-size: 1.2rem; line-height: 1; color: rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .08); border: 0; border-radius: 50%; cursor: pointer; }
.ev-x:hover { color: #fff; background: rgba(255, 255, 255, .2); }
@media (max-width: 560px) {
  .ev-full { clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px)); }
  .ev-face { clip-path: polygon(0 0, calc(100% - 23px) 0, 100% 23px, 100% 100%, 23px 100%, 0 calc(100% - 23px)); }
  .ev-sep { display: none; }
  .evfloat { right: 10px; bottom: 10px; width: calc(100vw - 20px); }
  .ev-compact.at-top { font-size: .9rem; }
}

/* =====================================================================
   Panel admin : nouveau look
   ===================================================================== */
.modal.studio-modal { width: min(1200px, 100%); }
.studio { height: min(92vh, 880px); grid-template-columns: 256px minmax(0, 1fr); background: #09090f; }
.side { gap: 4px; padding: 20px 16px 18px;
  background: radial-gradient(120% 50% at 0% 0%, color-mix(in srgb, var(--violet) 34%, transparent), transparent 62%), linear-gradient(180deg, #0e0e18, #08080e); }
.brand { padding: 2px 8px 16px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
.nav { gap: 3px; }
.nav-title { margin: 18px 12px 5px; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .34); }
.nav button { position: relative; padding: 11px 14px; }
.nav button.on::before { content: ""; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--cyan); box-shadow: 0 0 16px var(--cyan); }
.nav button.on svg { color: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
.nav em.hot { color: #fff; background: var(--red); box-shadow: 0 0 14px var(--red); }
.side-foot { padding-top: 12px; }
.main { padding: 28px 34px 36px; background: radial-gradient(70% 38% at 100% 0%, color-mix(in srgb, var(--violet) 13%, transparent), transparent 70%); }
.main .dash-head { align-items: flex-end; margin-bottom: 18px; }
.main .dash-head .dash-title h3 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.1rem); letter-spacing: -.02em; background: linear-gradient(90deg, #fff, #cfc0ff 75%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dash-title p { margin: 4px 0 0; color: var(--muted); }
.main .dash-head .btn.primary { padding: 12px 22px; border-radius: 999px; font-weight: 800; }
.main .dash-head .btn.back { background: transparent; }
.cmd { border-radius: 14px; }
.stat { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px; background: linear-gradient(160deg, color-mix(in srgb, var(--c, var(--violet)) 12%, #0e0e17), #0b0b12); border: 1px solid color-mix(in srgb, var(--c, var(--violet)) 30%, var(--line)); }
.stat .si { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px; color: var(--c, var(--violet)); background: color-mix(in srgb, var(--c, var(--violet)) 18%, #0c0c13); }
.stat .si svg { width: 22px; height: 22px; fill: currentColor; }
.stat b { font-size: 1.7rem; }
.stats.four { grid-template-columns: repeat(4, 1fr); }
.home-sub { margin: 26px 0 10px; font-size: 1.05rem; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.qa { display: flex; align-items: center; gap: 12px; padding: 16px 18px; font: inherit; font-weight: 700; text-align: left; color: var(--text); cursor: pointer; border-radius: 16px; background: #0e0e17; border: 1px solid var(--line); transition: transform .2s, border-color .2s, box-shadow .2s; }
.qa svg { width: 22px; height: 22px; fill: var(--cyan); flex: none; }
.qa:hover { transform: translateY(-2px); border-color: var(--violet); box-shadow: 0 12px 30px color-mix(in srgb, var(--violet) 22%, transparent); }

/* Liste des événements */
.evlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.evc { position: relative; display: grid; gap: 6px; padding: 16px 16px 14px 20px; overflow: hidden; border-radius: 16px; background: linear-gradient(160deg, color-mix(in srgb, var(--ev) 16%, #0d0d15), #0b0b12 65%); border: 1px solid color-mix(in srgb, var(--ev) 32%, var(--line)); transition: transform .2s, box-shadow .2s; }
.evc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ev); box-shadow: 0 0 18px var(--ev); }
.evc:hover { transform: translateY(-2px); box-shadow: 0 14px 34px color-mix(in srgb, var(--ev) 22%, transparent); }
.evc.pause { opacity: .72; }
.evc h4 { margin: 2px 0 0; font-size: 1.1rem; overflow-wrap: anywhere; }
.evc small { color: var(--muted); }
.evc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.evc-state { padding: 2px 11px; border-radius: 99px; font-size: .76rem; font-weight: 700; }
.evc-state.live { color: #6ee7b7; background: rgba(52, 211, 153, .16); }
.evc-state.done { color: var(--muted); background: rgba(255, 255, 255, .08); }
.evc-state.pause { color: #fcd34d; background: rgba(251, 191, 36, .15); }
.evc-place { font-size: .8rem; color: var(--muted); }
.evc-time { margin: 6px 0 2px; font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.evc-time .ev-live { font-size: 1.05rem; color: var(--muted); }
.evc-time.done .ev-mini { display: none; }
.evc-time.done .ev-live { display: inline; }
.evc-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ev-empty { display: grid; justify-items: center; gap: 12px; padding: 38px 20px; text-align: center; border: 1.5px dashed var(--line); border-radius: 22px; background: rgba(255, 255, 255, .02); }
.ev-empty h4 { margin: 0; font-size: 1.25rem; }
.ev-empty p { max-width: 46ch; margin: 0; color: var(--muted); }

/* Éditeur d'événement */
.ed { --ed: #9d4dff; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 24px; align-items: start; }
.ed-form { display: grid; gap: 14px; min-width: 0; }
.ed-card { padding: 16px 18px 18px; border-radius: 18px; background: #0c0c13; border: 1px solid var(--line); }
.ed-card h4 { margin: 0 0 2px; font-size: 1.02rem; }
.ed-card > label:first-of-type { margin-top: 8px; }
.ed-note { margin: 8px 0 0; font-size: .84rem; color: var(--muted); }
.ed-cap { display: block; margin-top: 8px; color: var(--cyan); font-weight: 600; }
.ed-prev { position: sticky; top: 0; display: grid; gap: 12px; min-width: 0; }
.ed-prev h4 { margin: 0; font-size: 1.02rem; }
.ed-stage { display: grid; min-width: 0; padding: 16px; border-radius: 18px; background: repeating-conic-gradient(#0d0d14 0 25%, #0a0a10 0 50%) 0 0 / 22px 22px; border: 1px solid var(--line); overflow: hidden; }
.ed-stage .ev-full { font-size: .9em; }
.ed-stage .ev-title { font-size: clamp(1.7rem, 4vw, 2.6rem); }
.ed-stage .ev-unit b { font-size: clamp(1.4rem, 3.4vw, 2.2rem); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.opt { display: grid; gap: 4px; align-content: start; padding: 10px; font: inherit; text-align: left; color: var(--text); cursor: pointer; border-radius: 14px; background: #10101a; border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s, opacity .2s; }
.opt small { color: var(--muted); font-size: .78rem; }
.opt:hover:not(:disabled) { border-color: var(--ed); }
.opt.on { border-color: var(--ed); box-shadow: 0 0 24px color-mix(in srgb, var(--ed) 40%, transparent); }
.opt:disabled { opacity: .38; cursor: not-allowed; }
.th { position: relative; display: block; height: 36px; margin-bottom: 4px; overflow: hidden; border-radius: 8px; background: linear-gradient(135deg, color-mix(in srgb, var(--ed) 50%, #12121c), #12121c); }
.th-event::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 7px; height: 12px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .75) 0 16%, transparent 16% 21%); transform: skewX(-12deg); }
.th-classic::after { content: ""; position: absolute; inset: 7px 12px; border-radius: 5px; background: rgba(255, 255, 255, .16); }
.th-compact::after { content: ""; position: absolute; left: 8px; right: 8px; top: 14px; height: 8px; border-radius: 4px; background: var(--ed); }
.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.swc { width: 34px; height: 34px; padding: 0; cursor: pointer; border-radius: 50%; background: var(--c); border: 2px solid transparent; transition: transform .15s, box-shadow .15s; }
.swc:hover { transform: scale(1.1); }
.swc.on { border-color: #fff; box-shadow: 0 0 18px var(--c); }
.swc-pick { width: 38px; height: 34px; padding: 0; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
.map { position: relative; display: grid; gap: 6px; max-width: 460px; margin-top: 10px; padding: 12px; border-radius: 16px; background: #07070c; border: 1px solid var(--line); }
.mz { display: flex; align-items: center; justify-content: center; min-height: 32px; padding: 6px 10px; font: inherit; font-size: .78rem; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 8px; background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .035) 0 8px, transparent 8px 16px); border: 1.5px dashed rgba(255, 255, 255, .22); transition: border-color .2s, color .2s, box-shadow .2s, background .2s; }
.mz:hover { color: var(--text); border-color: var(--cyan); }
.mz.on { color: #fff; border-style: solid; border-color: var(--ed); background: color-mix(in srgb, var(--ed) 32%, #0b0b12); box-shadow: 0 0 24px color-mix(in srgb, var(--ed) 55%, transparent); }
.z-float { position: absolute; right: 12px; bottom: 36px; width: 34%; min-height: 0; padding: 8px 6px; background-color: #0b0b12; }
.mf { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; background: #12121b; }
.mf i { display: block; border-radius: 4px; background: #262637; }
.f-nav { height: 20px; }
.f-nav i { flex: none; width: 28px; height: 5px; }
.f-hero { flex-direction: column; gap: 5px; padding: 12px; }
.f-hero .av { width: 30px; height: 30px; border-radius: 50%; }
.f-hero .ln { width: 58%; height: 5px; }
.f-hero .ln.s { width: 34%; }
.f-row { height: 40px; }
.f-row i { flex: 1; height: 100%; }
.f-row.shorts { height: 50px; }
.f-foot { height: 14px; }
.ed-save { position: sticky; bottom: -36px; z-index: 2; display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding: 16px 0 14px; background: linear-gradient(transparent, #09090f 38%); }
@media (max-width: 1020px) {
  .ed { grid-template-columns: 1fr; }
  .ed-prev { position: static; order: -1; }
}
@media (max-width: 760px) {
  .nav-title { display: none; }
  .nav button.on::before { display: none; }
  .stats.four { grid-template-columns: 1fr 1fr; }
  .opts { grid-template-columns: 1fr; }
  .main { padding: 20px 16px 28px; }
  .ed-save { bottom: 0; }
}

</style>

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? '' : v);
  }
  children.flat().forEach(c => c != null && node.append(c));
  return node;
}

function youtubeId(url) {
  try {
    const u = new URL(url);
    if (u.hostname === 'youtu.be') return u.pathname.slice(1);
    if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
    return u.searchParams.get('v');
  } catch { return null; }
}
function thumbOf(item) {
  if (item.thumb && /^https?:/i.test(item.thumb)) return item.thumb;
  const id = youtubeId(item.url);
  return id && /^[\w-]{6,15}$/.test(id) ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : PLACEHOLDER;
}

let lastSnap = 0, seeding = false;
function snapshot() {
  if (seeding || Date.now() - lastSnap < 20000) return;
  lastSnap = Date.now();
  try {
    const b = JSON.parse(localStorage.getItem('yolao.bak') || '[]');
    b.unshift({ t: Date.now(), d: { items: readLocal('items') || [], teasers: readLocal('teasers') || [], settings: readLocal('settings') || {} } });
    localStorage.setItem('yolao.bak', JSON.stringify(b.slice(0, 5)));
  } catch { /* quota : pas de sauvegarde */ }
}
function logAct(x) {
  try {
    const l = JSON.parse(localStorage.getItem('yolao.log') || '[]');
    l.unshift({ t: Date.now(), x }); localStorage.setItem('yolao.log', JSON.stringify(l.slice(0, 60)));
  } catch { /* ignore */ }
}
function save(k, v) {

  const s = JSON.stringify(v);

    try { localStorage.removeItem('yolao.bak'); localStorage.setItem(K[k], s); }

const hasLocal = () => DATA_KEYS.some(k => localStorage.getItem(K[k]) !== null);
function getStore() {

}
function seedLocal() { seeding = true; try { DATA_KEYS.forEach(k => { if (localStorage.getItem(K[k]) === null) save(k, published[k]); }); } finally { seeding = false; } }
async function loadPublished() {
  try {
    const r = await fetch('yolao-data.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    published = {
      items: Array.isArray(d.items) ? d.items : [],
      teasers: Array.isArray(d.teasers) ? d.teasers : [],
      settings: d.settings && typeof d.settings === 'object' ? d.settings : {}

  } catch { /* pas de fichier publié : normal en local */ }
}

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function login(username, password) {
  if (username !== 'Yolao') throw new Error('Identifiants incorrects.');
  const h = await sha256(password || '');
  const saved = localStorage.getItem(K.pw);
  if (!saved) {
    if ((password || '').length < 8) throw new Error('Première connexion : choisissez un mot de passe de 8 caractères minimum.');
    localStorage.setItem(K.pw, h);
  } else if (saved !== h) throw new Error('Identifiants incorrects.');
  sessionStorage.setItem('yolao.admin', '1');
  seedLocal();
  logAct('Connexion au panel');
}

function checkItem(b) {
  if (!String(b.title || '').trim()) throw new Error('Titre requis.');
  if (!isYt(b.url)) throw new Error('Lien YouTube invalide.');
  if (b.thumb && !isHttp(b.thumb)) throw new Error('URL de miniature invalide.');
}
function saveItem(b, id) {
  checkItem(b);
  const items = readLocal('items') || [];
  const fields = { title: b.title.trim(), description: b.description || '', url: b.url.trim(), thumb: (b.thumb || '').trim(), date: b.date || '', tags: (b.tags || '').trim(), pinned: !!b.pinned, publishAt: b.publishAt || '' };
  if (id) {
    const it = items.find(i => i.id === id); if (!it) throw new Error('Introuvable.');
    Object.assign(it, fields);
  } else {
    const pos = Math.min(0, ...items.filter(i => i.kind === b.kind).map(i => i.position)) - 1;
    items.push({ id: Date.now(), kind: b.kind, position: pos, ...fields });
  }
  save('items', items);
  logAct((id ? 'Modification' : 'Ajout') + ' : ' + fields.title);
}
function saveTeaser(b, id) {
  const clip = (s, n) => String(s || '').trim().slice(0, n);
  const title = clip(b.title, 120);
  if (!title) throw new Error('Titre requis.');
  if (!b.at || isNaN(new Date(b.at))) throw new Error('Date et heure requises.');
  const link = clip(b.link, 500);
  if (link && !isHttp(link)) throw new Error('Lien invalide (https://…).');
  if (b.image && !safeImg(b.image)) throw new Error('Image invalide.');
  const list = readLocal('teasers') || [];
  const fields = {
    title, description: clip(b.description, 400), at: new Date(b.at).toISOString(), image: b.image || '', link,
    linkLabel: clip(b.linkLabel, 30) || 'Regarder', badge: clip(b.badge, 30), endText: clip(b.endText, 60) || 'C’est parti !',
    place: EV_PLACES[b.place] ? b.place : 'intro', style: EV_STYLES[b.style] ? b.style : 'event',
    color: /^#[0-9a-f]{6}$/i.test(b.color || '') ? b.color.toLowerCase() : '#9d4dff', endMode: b.endMode === 'hide' ? 'hide' : 'live',
    ctaNow: !!b.ctaNow, enabled: b.enabled !== false
  };
  if (id) { const t = list.find(x => x.id === id); if (!t) throw new Error('Introuvable.'); Object.assign(t, fields); }
  else list.push({ id: Date.now(), created: Date.now(), ...fields });
  save('teasers', list);
  logAct((id ? 'Événement modifié' : 'Événement ajouté') + ' : ' + title);
}
function removeById(key, id) { save(key, (readLocal(key) || []).filter(i => i.id !== id)); }
function moveItem(id, dir) {
  const items = readLocal('items') || [];
  const it = items.find(i => i.id === id); if (!it) return;
  const list = items.filter(i => i.kind === it.kind).sort((a, b) => a.position - b.position);
  const i = list.indexOf(it), j = dir === 'up' ? i - 1 : i + 1;
  if (j >= 0 && j < list.length) { [list[i], list[j]] = [list[j], list[i]]; list.forEach((x, n) => x.position = n); }
  save('items', items);
}
function fileToDataUrl(file, max = 1100) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        const x = c.getContext('2d');
        x.fillStyle = '#0b0b12'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

}

function card(item, kind, featured) {
  const img = el('img', { src: thumbOf(item), alt: '', loading: 'lazy' });

  const body = el('div', { class: 'card-body' },

/* Aperçu au survol : lance un extrait muet de la vidéo YouTube dans la miniature */
function attachPreview(link, thumbBox, item) {
  const id = youtubeId(item.url);
  if (!isOn(SET.previewOn, CONFIG.previewEnabled) || !id || !/^[\w-]{6,15}$/.test(id)) return;
  if (!window.matchMedia('(hover: hover)').matches) return;
  let timer = null, frame = null;
  const start = () => {
    if (frame || timer) return;
    timer = setTimeout(() => {
      timer = null;
      const q = new URLSearchParams({
        autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1,
        modestbranding: 1, iv_load_policy: 3, loop: 1, playlist: id, start: SET.previewStart ?? CONFIG.previewStart
      });
      if (/^https?:$/.test(location.protocol)) q.set('origin', location.origin);
      frame = el('iframe', {
        class: 'preview', src: `https://www.youtube-nocookie.com/embed/${id}?${q}`,
        allow: 'autoplay; encrypted-media', tabindex: '-1', 'aria-hidden': 'true', title: ''
      });
      frame.addEventListener('load', () => frame && frame.classList.add('on'));
      thumbBox.append(frame);
    }, SET.previewDelay ?? CONFIG.previewDelay);
  };
  const stop = () => { clearTimeout(timer); timer = null; if (frame) { frame.remove(); frame = null; } };
  link.addEventListener('mouseenter', start);
  link.addEventListener('mouseleave', stop);
  link.addEventListener('focus', start);
  link.addEventListener('blur', stop);
}

function renderGrid(container, items, kind, emptyText, withFeatured) {

  container.classList.add(kind === 'short' ? 'short-grid' : 'video-grid');
  const feat = withFeatured && kind === 'video' && items.length >= 3;
  if (feat) container.classList.add('has-featured');
  items.forEach((i, n) => container.append(card(i, kind, feat && n === 0)));
}

function tick() {
  tickLock();
  if (Date.now() >= nextPub) { renderPublic(); return; }
  const now = Date.now();
  document.querySelectorAll('[data-at]').forEach(n => {
    const end = new Date(n.dataset.at), left = end - now;
    const done = isNaN(left) || left <= 0;
    n.classList.toggle('done', done);
    n.classList.toggle('hot', !done && left < 36e5);
    const since = +n.dataset.since;
    if (since && end > since) n.style.setProperty('--p', done ? 100 : Math.min(100, Math.max(0, (now - since) / (end - since) * 100)).toFixed(2));
    if (done) return;
    const s = Math.floor(left / 1000);
    const v = { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
    n.querySelectorAll('[data-u]').forEach(b => {
      const txt = String(v[b.dataset.u]).padStart(2, '0');
      if (b.textContent === txt) return;
      b.textContent = txt;
      if (b.dataset.u === 's') { b.classList.remove('tick'); void b.offsetWidth; b.classList.add('tick'); }
    });
  });
}

const Sound = (() => {
  let ctx = null;
  const on = () => localStorage.getItem('yolao.sound') !== '0';
  function tone(freq, dur, o = {}) {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime + (o.at || 0), osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + o.slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0001, (o.vol || .12) * getPrefs().volume / 70), t + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + .03);
  }
  const S = {
    click: () => tone(900, .05, { type: 'triangle', vol: .06 }),
    open: () => { tone(440, .12); tone(660, .14, { at: .08 }); tone(880, .24, { at: .16 }); },
    close: () => { tone(660, .1, { type: 'triangle' }); tone(440, .2, { type: 'triangle', at: .08 }); },
    success: () => { tone(660, .1, { type: 'triangle' }); tone(990, .24, { type: 'triangle', at: .09 }); },
    error: () => { tone(220, .18, { type: 'sawtooth', vol: .08 }); tone(165, .3, { type: 'sawtooth', vol: .08, at: .15 }); },
    lock: () => { tone(320, .4, { type: 'square', vol: .06, slide: -200 }); tone(140, .55, { type: 'sawtooth', vol: .08, at: .28 }); },
    unlock: () => { tone(392, .12, { type: 'triangle' }); tone(523, .12, { type: 'triangle', at: .1 }); tone(784, .32, { type: 'triangle', at: .2 }); }
  };
  return {
    on,
    set(v) { localStorage.setItem('yolao.sound', v ? '1' : '0'); },
    play(n) { if (!on() || getPrefs().volume <= 0) return; try { S[n] && S[n](); } catch { /* audio indisponible */ } }
  };
})();

/* Barre de commandes */
function runCmd(raw) {
  const [c, ...r] = raw.replace(/^[:\/]/, '').trim().split(/\s+/), arg = r.join(' ');
  const go = (k) => { tab = k; editing = null; showDashboard(); };
  switch ((c || '').toLowerCase()) {
    case 'help': return 'Commandes : tab <home|video|short|teaser|lock|log|settings> · event <minutes> <titre> · lock <minutes> <raison> · unlock · announce <texte|off> · theme <violet|cyan|rouge|vert> · publish · export · confetti · logout';
    case 'event': case 'countdown': {
      const m = parseInt(r[0], 10), name = r.slice(1).join(' ');
      if (!m || m < 1 || !name) return 'Erreur : event <minutes> <titre>, ex : event 30 Grand live';
      const list = readLocal('teasers') || [];
      list.push({ id: Date.now(), created: Date.now(), ...EV_DEF, title: name, at: new Date(Date.now() + m * 60000).toISOString() });
      save('teasers', list); logAct(`Événement rapide (${m} min) : ${name}`); renderPublic(); go('teaser'); return 'Événement créé';
    }
    case 'tab': if (!TITLES[arg]) return 'Erreur : onglet inconnu.'; go(arg); return 'Onglet ouvert';
    case 'lock': {
      const m = parseInt(r[0], 10), why = r.slice(1).join(' ');
      if (!m || m < 1 || !why) return 'Erreur : lock <minutes> <raison>, ex : lock 30 mise à jour';
      patchSettings({ lock: { type: 'maintenance', targets: 'all', reason: why, startedAt: Date.now(), until: Date.now() + m * 60000 } });
      logAct(`Verrouillage (${m} min) : ${why}`); Sound.play('lock'); renderPublic(); go('lock'); return 'Site verrouillé';
    }
    case 'unlock': patchSettings({ lock: null }); logAct('Site rouvert'); Sound.play('unlock'); renderPublic(); go('lock'); return 'Site rouvert';
    case 'announce': {
      if (!arg) return 'Erreur : announce <texte> ou announce off';
      const cur = (readLocal('settings') || {}).announce || {};
      patchSettings({ announce: arg === 'off' ? {} : { text: arg, tone: cur.tone || 'info' } });
      logAct('Annonce : ' + arg); renderPublic(); return arg === 'off' ? 'Annonce retirée' : 'Annonce publiée';
    }
    case 'theme': if (!ACCENTS[arg]) return 'Erreur : violet, cyan, rouge ou vert.'; patchSettings({ accent: arg }); renderPublic(); return 'Thème ' + arg;
    case 'publish': publishToGitHub(); return 'Publication lancée';
    case 'export': exportData(); return 'Export lancé';
    case 'confetti': confetti(); return 'Fête !';
    case 'logout': logout(); return 'Déconnecté';
    default: return 'Erreur : commande inconnue (tape help).';
  }
}

function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = el('canvas', { class: 'confetti' }); document.body.append(c);
  c.width = innerWidth; c.height = innerHeight;
  const x = c.getContext('2d'), cols = ['#8b5cf6', '#22d3ee', '#ff4d6d', '#fbbf24', '#34d399'];
  const ps = Array.from({ length: 150 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 5, s: 5 + Math.random() * 7, r: Math.random() * 6, c: cols[Math.random() * 5 | 0] }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(q => { q.x += q.vx; q.y += q.vy; q.r += .1; x.save(); x.translate(q.x, q.y); x.rotate(q.r); x.fillStyle = q.c; x.fillRect(-q.s / 2, -q.s / 2, q.s, q.s * .6); x.restore(); });
    if (++f < 180) requestAnimationFrame(loop); else c.remove();
  })();
}

/* ======= Publication directe sur GitHub (visible par tout le monde) ======= */
const GH_KEY = 'yolao.gh';
const GH_DEF = { repo: '', branch: 'main', path: 'yolao-data.json', token: '', auto: true };
function ghCfg() { try { return { ...GH_DEF, ...(JSON.parse(localStorage.getItem(GH_KEY)) || {}) }; } catch { return { ...GH_DEF }; } }
const ghReady = () => { const c = ghCfg(); return /^[\w.-]+\/[\w.-]+$/.test(c.repo) && c.token.length > 20; };
const toB64 = (str) => { let x = ''; new TextEncoder().encode(str).forEach(v => { x += String.fromCharCode(v); }); return btoa(x); };
async function ghErr(r) {
  if (r.status === 401) return new Error('Token refusé ou expiré : crée-en un nouveau sur GitHub.');
  if (r.status === 403) return new Error('Accès refusé : le token doit avoir la permission « Contents : Read and write » sur ce dépôt.');
  if (r.status === 404) return new Error('Dépôt, branche ou token introuvable : vérifie le nom du dépôt et que le token y a accès.');
  if (r.status === 409 || r.status === 422) return new Error('Conflit pendant la publication : réessaie dans un instant.');
  return new Error('Erreur GitHub (' + r.status + ').');
}
let ghBusy = false, ghAgain = false, ghTimer = null;
function scheduleAutoPublish() {
  if (seeding || !ghReady() || ghCfg().auto === false) return;
  clearTimeout(ghTimer); ghTimer = setTimeout(publishToGitHub, 2500);
}
async function publishToGitHub() {
  if (ghBusy) { ghAgain = true; return; }
  if (!ghReady()) { tab = 'settings'; editing = null; showDashboard(); toast('Remplis d’abord « Publication GitHub » dans Réglages (une seule fois).', 'error'); return; }
  const c = ghCfg();
  const d = { items: readLocal('items') || [], teasers: readLocal('teasers') || [], settings: readLocal('settings') || {} };
  const url = 'https://api.github.com/repos/' + c.repo + '/contents/' + c.path.split('/').map(encodeURIComponent).join('/');
  const H = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28' };
  ghBusy = true; toast('Publication en cours…', null);
  try {
    let sha;
    const g = await fetch(url + '?ref=' + encodeURIComponent(c.branch), { headers: H, cache: 'no-store' });
    if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw await ghErr(g);
    const put = await fetch(url, {
      method: 'PUT', headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Mise à jour depuis le Studio Yolao', content: toB64(JSON.stringify(d, null, 1)), branch: c.branch, ...(sha ? { sha } : {}) })
    });
    if (!put.ok) throw await ghErr(put);
    published = d; logAct('Publication sur GitHub'); confetti();
    toast('Publié ! Tout le monde le verra dans 1 à 2 minutes.');
  } catch (e) {
    toast(e instanceof TypeError ? 'Pas de connexion à GitHub : vérifie ton réseau.' : (e.message || 'Erreur de publication'), 'error');
  } finally { ghBusy = false; if (ghAgain) { ghAgain = false; scheduleAutoPublish(); } }
}

      fld('s-ann', 'Bandeau d’annonce (vide = masqué)', f.ann), fld('s-annt', 'Couleur du bandeau', f.annTone),

    g('Préférences du panel', 'Propres à ce navigateur : elles ne changent rien pour les visiteurs.',
      pt.sound.node, fld('s-vol', 'Volume des sons', f.vol), pt.boot.node, pt.confirm.node,
      fld('s-idle', 'Verrouiller le panel après X minutes d’inactivité (0 = jamais)', f.idle),
      fld('s-lmins', 'Durée par défaut d’un verrouillage du site (minutes)', f.lmins), fld('s-ltarget', 'Appareils bloqués par défaut', f.ltarget)),
    g('Publication GitHub', 'À remplir une seule fois. Crée sur GitHub un token « fine-grained » limité à ce dépôt, avec la permission Contents : Read and write (github.com/settings/personal-access-tokens/new). Le token reste uniquement dans ce navigateur : il n’est jamais publié sur le site.',
      fld('s-ghrepo', 'Dépôt (pseudo/nom)', f.ghRepo), fld('s-ghbranch', 'Branche', f.ghBranch), fld('s-ghpath', 'Fichier de données', f.ghPath), fld('s-ghtoken', 'Token GitHub', f.ghToken), ghAuto.node),
    g('Publication', null, fld('s-pub', 'Lien de ton dossier d’hébergement (bouton « Ouvrir mon dossier »)', f.pub)),
    g('Sécurité', null, fld('s-pw', 'Nouveau mot de passe du panel (8 caractères minimum)', f.pw)),
    g('Zone dangereuse', 'À utiliser avec précaution.', el('div', { class: 'row flush wrap' },
      el('button', { class: 'btn small', type: 'button', text: 'Supprimer les sauvegardes', onclick: () => { localStorage.removeItem('yolao.bak'); toast('Sauvegardes supprimées'); } }),
      el('button', { class: 'btn small', type: 'button', text: 'Réinitialiser les préférences du panel', onclick: () => { localStorage.removeItem('yolao.prefs'); toast('Préférences réinitialisées'); showDashboard(); } }),
      el('button', { class: 'btn small danger', type: 'button', text: 'Revenir aux données publiées', onclick: dangerReset }))),
    msg,
    el('div', { class: 'savebar' }, el('button', { class: 'btn-glow', type: 'submit' }, el('span', { text: 'Enregistrer les réglages' }))));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const bad = (m) => { msg.textContent = m; };
    const val = (n) => n.value.trim();
    const urlOk = (v) => !v || isHttp(v);
    if (!urlOk(val(f.chan))) return bad('Lien de la chaîne invalide.');
    if (!urlOk(val(f.pub))) return bad('Lien du dossier invalide.');
    if (val(f.ghRepo) && !/^[\w.-]+\/[\w.-]+$/.test(val(f.ghRepo))) return bad('Dépôt GitHub : format pseudo/nom-du-depot.');
    for (const k of Object.keys(SOCIAL_NAMES)) if (!urlOk(val(f[k]))) return bad('Lien ' + SOCIAL_NAMES[k] + ' invalide.');
    if (val(f.mail) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val(f.mail))) return bad('Adresse e-mail invalide.');
    if (f.pw.value && f.pw.value.length < 8) return bad('Mot de passe : 8 caractères minimum.');
    const n = (node, lo, hi, d) => { const v = Math.floor(Number(node.value)); return node.value !== '' && Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
    try {
      localStorage.setItem(GH_KEY, JSON.stringify({ repo: val(f.ghRepo), branch: val(f.ghBranch) || 'main', path: val(f.ghPath) || 'yolao-data.json', token: f.ghToken.value.trim() || ghCfg().token, auto: ghAuto.inp.checked }));
      f.ghToken.value = '';
      if (f.pw.value) { localStorage.setItem(K.pw, await sha256(f.pw.value)); f.pw.value = ''; }
      const links = {};
      for (const k of Object.keys(SOCIAL_NAMES)) if (val(f[k])) links[k] = val(f[k]);
      const next = {
        ...(readLocal('settings') || {}),
        siteName: val(f.siteName), channelUrl: val(f.chan), contactEmail: val(f.mail), tagline: val(f.tagline), about: val(f.about),
        seoTitle: val(f.seoT), seoDesc: val(f.seoD), accent: f.accent.value, bg: f.bg.value, density: f.dens.value, sort: f.sort.value,
        maxVideos: n(f.maxv, 0, 99, 0), previewDelay: n(f.pdelay, 0, 5000, 450), previewStart: n(f.pstart, 0, 3600, 8),
        announce: { text: val(f.ann), tone: f.annTone.value }, publishUrl: val(f.pub), links
      };
      TOG.forEach(([k]) => { next[k] = tg[k].inp.checked; });
      save('settings', next);
      setPrefs({ volume: n(f.vol, 0, 100, 70), idleMin: n(f.idle, 0, 240, 10), boot: pt.boot.inp.checked, confirmDel: pt.confirm.inp.checked, lockMins: n(f.lmins, 1, 10080, 120), lockTarget: f.ltarget.value });
      Sound.set(pt.sound.inp.checked);
      showAll = false; msg.textContent = '';
      logAct('Réglages enregistrés'); toast('Réglages enregistrés'); renderPublic();
    } catch (err) { bad(err.message); }
  });
  return form;
}

function showForm(item) {
  const f = {
    title: el('input', { id: 'f-title', maxlength: 150, required: true, value: item?.title || '' }),
    url: el('input', { id: 'f-url', type: 'url', required: true, placeholder: 'https://www.youtube.com/watch?v=…', value: item?.url || '' }),
    thumb: el('input', { id: 'f-thumb', type: 'url', placeholder: 'Laisser vide pour utiliser la miniature YouTube', value: item?.thumb || '' }),
    date: el('input', { id: 'f-date', type: 'date', value: item?.date || new Date().toISOString().slice(0, 10) }),
    desc: el('textarea', { id: 'f-desc', maxlength: 400 }),
    tags: el('input', { id: 'f-tags', maxlength: 80, placeholder: 'gaming, roblox, vlog', value: item?.tags || '' }),
    pub: el('input', { id: 'f-pub', type: 'datetime-local', value: item?.publishAt || '' }),
    pin: el('input', { id: 'f-pin', type: 'checkbox', checked: !!item?.pinned })
  };
  f.desc.value = item?.description || '';
  const msg = el('div', { class: 'msg', role: 'alert' });
  const form = el('form', {},
    el('h3', { text: item ? 'Modifier' : (tab === 'video' ? 'Ajouter une vidéo' : 'Ajouter un Short') }),
    el('label', { for: 'f-title', text: 'Titre' }), f.title,
    el('label', { for: 'f-url', text: 'Lien YouTube' }), f.url,
    el('label', { for: 'f-thumb', text: 'URL de la miniature (facultatif)' }), f.thumb,
    el('label', { for: 'f-date', text: 'Date' }), f.date,
    el('label', { for: 'f-tags', text: 'Étiquettes (séparées par des virgules, facultatif)' }), f.tags,
    el('label', { for: 'f-pub', text: 'Programmer la publication (facultatif : visible sur le site à cette date)' }), f.pub,
    el('label', { class: 'check' }, f.pin, ' Épingler en haut du site'),
    tab === 'video' ? el('label', { for: 'f-desc', text: 'Description courte (facultatif)' }) : null,
    tab === 'video' ? f.desc : null, msg,
    el('div', { class: 'row' },
      el('button', { class: 'btn', type: 'button', text: 'Annuler', onclick: showDashboard }),
      el('button', { class: 'btn primary', type: 'submit', text: 'Enregistrer' })));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const body = { kind: tab, title: f.title.value, url: f.url.value, thumb: f.thumb.value, date: f.date.value, tags: f.tags.value, pinned: f.pin.checked, publishAt: f.pub.value, description: tab === 'video' ? f.desc.value : '' };
    try { saveItem(body, item?.id); toast('Enregistré'); showDashboard(); renderPublic(); }
    catch (err) { msg.textContent = err.message; }
  });
  adminRoot.replaceChildren(openOverlay(el('div', { class: 'modal' }, form)));
  f.title.focus();
}

function remove(key, item) {
  if (getPrefs().confirmDel && !confirm(`Supprimer « ${item.title} » ? Cette action est définitive.`)) return;
  try { removeById(key, item.id); logAct('Suppression : ' + item.title); toast('Supprimé'); showDashboard(); renderPublic(); }
  catch (err) { toast(err.message, 'error'); }
}
function logout() { sessionStorage.removeItem('yolao.admin'); closeAdmin(); toast('Déconnecté', null); }

// Raccourci W : n'ouvre que la fenêtre de connexion (ce n'est pas une sécurité)
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() !== 'w' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches('input, textarea, select, [contenteditable]')) return;
  if (adminRoot.children.length) return;
  e.preventDefault();
  Sound.play('open');
  isAdmin() ? showDashboard() : showLogin();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAdmin(); });
document.addEventListener('keydown', (e) => {
  if (!adminRoot.querySelector('.studio') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches('input, textarea, select')) return;
  const k = e.key.toLowerCase();
  if (k === ':' || k === '/') { e.preventDefault(); const c = adminRoot.querySelector('.cmd'); if (c) c.focus(); }
  else if (k === 'n') { const b = adminRoot.querySelector('.main .dash-head .btn.primary'); if (b) { e.preventDefault(); b.click(); } }
  else if (k === 'e') { e.preventDefault(); exportData(); }
});

/* ======= Effets ======= */
if (window.matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)').matches) {
  const glow = el('div', { class: 'cursor-glow' });
  document.body.append(glow);
  window.addEventListener('pointermove', (e) => { glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; glow.style.opacity = 1; });
  document.addEventListener('mouseleave', () => { glow.style.opacity = 0; });
}

/* Code Konami (↑↑↓↓←→←→ B A) et verrouillage du panel après 10 min d'inactivité */
const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
let kpos = 0, lastAct = Date.now();
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  kpos = k === KONAMI[kpos] ? kpos + 1 : (k === KONAMI[0] ? 1 : 0);
  if (kpos === KONAMI.length) {
    kpos = 0; confetti(); Sound.play('unlock');
    document.body.classList.add('party'); setTimeout(() => document.body.classList.remove('party'), 4000);
  }
});
['pointerdown', 'keydown', 'pointermove'].forEach(ev => window.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
setInterval(() => {
  if (adminRoot.children.length && isAdmin() && getPrefs().idleMin > 0 && Date.now() - lastAct > getPrefs().idleMin * 60000) { logout(); toast('Panel verrouillé (inactivité)', 'error'); }
}, 30000);

/* ======= Démarrage ======= */
document.getElementById('search').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); renderPublic(); });
setupHeader();
setupNav();
renderPublic();
observeReveal();
setInterval(tick, 1000);
loadPublished().then(renderPublic);

</script>
</body>
